<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabricación - Frutitos de Casa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-frutitos navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#" id="logoNavbar">Frutitos de Casa ERP</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse d-none d-lg-block" id="menuDesktop">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2 ms-lg-4">
                    <li class="nav-item" id="menu-ventas"><a class="nav-link px-3" href="ventas.html">Ventas</a></li>
                    <li class="nav-item" id="menu-inventario"><a class="nav-link px-3" href="inventario.html">Inventario</a></li>
                    <li class="nav-item" id="menu-fabricacion"><a class="nav-link px-3" href="fabricacion.html">Fabricación</a></li>
                    <li class="nav-item" id="menu-compras"><a class="nav-link px-3" href="compras.html">Compras</a></li>
                    <li class="nav-item" id="menu-calidad"><a class="nav-link px-3" href="calidad.html">Calidad</a></li>
                </ul>
                <div class="d-flex align-items-center mt-2 mt-lg-0 gap-3">
                    <span class="navbar-text text-white mb-0 d-flex align-items-center"><i class="bi bi-person-circle me-2"></i> <span class="user-name">Cargando...</span></span>
                    <a href="#" onclick="logout(); return false;" class="btn btn-outline-light btn-sm rounded-pill px-3">Salir</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mt-md-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3 gap-2">
            <h3 class="text-secondary mb-0" id="tituloFabricacion">Órdenes de Fabricación (MRP)</h3>
            <button class="btn btn-fresa" id="btnNuevaOF" onclick="abrirModalOF()">
                <i class="bi bi-gear-fill me-2"></i> Nueva Orden Manual
            </button>
        </div>
        
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr><th>Nº OF</th><th>Producto</th><th>Cantidad</th><th>Lote</th><th>Estado</th><th>Acciones</th></tr>
                        </thead>
                        <tbody id="tbodyFabricacion">
                            <tr><td colspan="6" class="text-center text-muted py-4">Cargando datos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="mi-modal-overlay" id="modalNuevaOF">
        <div class="mi-modal-caja" style="max-width: 600px;">
            <div class="position-relative p-3" style="background-color: var(--mermelada-oscuro);">
                <h5 class="m-0 fw-bold text-center text-white w-100" style="color: white !important;"><i class="bi bi-gear me-2"></i> Nueva Orden de Fabricación</h5>
                <button type="button" class="btn-close btn-close-white position-absolute top-50 end-0 translate-middle-y me-3" onclick="cerrarModalOF()"></button>
            </div>
            <form id="formOF">
                <div class="p-4">
                    <div id="errorOF" class="alert alert-danger d-none"></div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Producto a Fabricar</label>
                        <select class="form-select" name="producto" id="selectProductoFabricar" required>
                            <option value="Mermelada de Fresa">Mermelada de Fresa</option>
                        </select>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">Cantidad</label>
                            <input type="number" class="form-control" name="cantidad" id="cantidadOF" min="1" placeholder="Ej: 20" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">Nº Orden (Auto)</label>
                            <input type="text" class="form-control" name="numeroOF" id="numeroOF" readonly>
                        </div>
                    </div>
                </div>
                <div class="p-3 bg-light d-flex justify-content-end gap-2 border-top">
                    <button type="button" class="btn btn-secondary" onclick="cerrarModalOF()">Cancelar</button>
                    <button type="submit" class="btn btn-fresa" id="btnGuardarOF">Crear Orden</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'login.html'; return; }
            
            const user = JSON.parse(localStorage.getItem('user'));
            const rol = user.rol.toLowerCase();
            renderizarUsuario();

            if (rol !== 'administrador' && rol !== 'produccion') {
                alert('No tienes permiso'); window.location.href = 'dashboard.html'; return;
            }
            document.getElementById('logoNavbar').href = rol === 'administrador' ? 'dashboard.html' : 'fabricacion.html';

            const modulosEscritorio = ['menu-ventas', 'menu-inventario', 'menu-fabricacion', 'menu-compras', 'menu-calidad'];
            const modulosMovil = ['menu-ventas-mobile', 'menu-inventario-mobile', 'menu-fabricacion-mobile', 'menu-compras-mobile', 'menu-calidad-mobile'];
            
            modulosEscritorio.forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
            modulosMovil.forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });

            if (rol === 'administrador') {
                modulosEscritorio.forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'block'; });
                modulosMovil.forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'block'; });
                document.getElementById('btnNuevaOF').style.display = 'none';
                document.getElementById('tituloFabricacion').innerText = "Reporte de Fabricación (Solo Lectura)";
            } else if (rol === 'produccion') {
                ['menu-inventario', 'menu-fabricacion', 'menu-compras'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'block'; });
                ['menu-inventario-mobile', 'menu-fabricacion-mobile', 'menu-compras-mobile'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'block'; });
            }

            await cargarFabricacion();
        });

        async function cargarFabricacion() {
            const tbody = document.getElementById('tbodyFabricacion');
            try {
                const ordenes = await api.get('/fabricacion');
                if (ordenes.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">No hay órdenes registradas</td></tr>`;
                    return;
                }
                tbody.innerHTML = ordenes.map(o => {
                    let badge = 'bg-warning text-dark';
                    if (o.estado === 'En Proceso') badge = 'bg-primary';
                    if (o.estado === 'Terminada') badge = 'bg-success';
                    if (o.estado === 'Pendiente por Iniciar') badge = 'bg-secondary';

                    let btnAccion = '';
                    // Si el admin está mirando, no mostramos botones
                    const user = JSON.parse(localStorage.getItem('user'));
                    if (user.rol.toLowerCase() === 'produccion') {
                        if (o.estado === 'Pendiente por Iniciar') {
                            btnAccion = `<button class="btn btn-sm btn-outline-primary" onclick="cambiarEstado('${o.numeroOF}', 'En Proceso')"><i class="bi bi-play-fill"></i> Iniciar</button>`;
                        } else if (o.estado === 'En Proceso') {
                            btnAccion = `<button class="btn btn-sm btn-outline-success" onclick="cambiarEstado('${o.numeroOF}', 'Terminada')"><i class="bi bi-check-lg"></i> Terminar</button>`;
                        }
                    }

                    return `
                        <tr>
                            <td><strong>${o.numeroOF}</strong></td>
                            <td>${o.producto}</td>
                            <td>${o.cantidad} frascos</td>
                            <td><span class="badge bg-secondary">${o.loteAsignado || 'Sin asignar'}</span></td>
                            <td><span class="badge ${badge}">${o.estado}</span></td>
                            <td>${btnAccion}</td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Error: ${error.message}</td></tr>`;
            }
        }

        async function cambiarEstado(numeroOF, nuevoEstado) {
            if(!confirm(`¿Estás seguro de pasar la orden ${numeroOF} a "${nuevoEstado}"?`)) return;
            
            try {
                await api.put(`/fabricacion/${numeroOF}/estado`, { estado: nuevoEstado });
                await cargarFabricacion();
            } catch (error) {
                alert("Error al cambiar estado: " + error.message);
            }
        }

        function abrirModalOF() { 
            document.getElementById('formOF').reset();
            document.getElementById('errorOF').classList.add('d-none');
            document.getElementById('numeroOF').value = 'OF-MAN-' + Date.now().toString().slice(-6);
            document.getElementById('modalNuevaOF').classList.add('activo'); 
        }
        function cerrarModalOF() { document.getElementById('modalNuevaOF').classList.remove('activo'); }
        document.getElementById('modalNuevaOF').addEventListener('click', function(e) { if (e.target === this) cerrarModalOF(); });

        document.getElementById('formOF').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnGuardarOF');
            const errorDiv = document.getElementById('errorOF');
            btn.disabled = true; btn.innerText = 'Creando...'; errorDiv.classList.add('d-none');

            const datos = {
                numeroOF: document.getElementById('numeroOF').value,
                producto: document.getElementById('selectProductoFabricar').value,
                cantidad: parseInt(document.getElementById('cantidadOF').value),
                estado: 'Pendiente por Iniciar'
            };

            try {
                await api.post('/fabricacion', datos);
                cerrarModalOF();
                await cargarFabricacion();
            } catch (error) {
                errorDiv.innerText = error.message; errorDiv.classList.remove('d-none');
            } finally {
                btn.disabled = false; btn.innerText = 'Crear Orden';
            }
        });
    </script>
</body>
</html>
