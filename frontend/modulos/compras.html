<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras - Frutitos de Casa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-frutitos navbar-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#" id="logoNavbar">Frutitos de Casa ERP</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse d-none d-lg-block" id="menuDesktop">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2 ms-lg-4">
                    <li class="nav-item" id="menu-ventas"><a class="nav-link px-3" href="ventas.html">Ventas</a></li>
                    <li class="nav-item" id="menu-inventario"><a class="nav-link px-3" href="inventario.html">Inventario</a></li>
                    <li class="nav-item" id="menu-fabricacion"><a class="nav-link px-3" href="fabricacion.html">Fabricación</a></li>
                    <li class="nav-item" id="menu-compras"><a class="nav-link px-3" href="compras.html">Compras</a></li>
                    <li class="nav-item" id="menu-calidad"><a class="nav-link px-3" href="calidad.html">Calidad</a></li>
                </ul>
                <div class="d-flex align-items-center mt-2 mt-lg-0 gap-3">
                    <span class="navbar-text text-white mb-0 d-flex align-items-center"><i class="bi bi-person-circle me-2"></i> <span class="user-name">Cargando...</span></span>
                    <a href="#" onclick="logout(); return false;" class="btn btn-outline-light btn-sm rounded-pill px-3">Salir</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mt-md-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3 gap-2">
            <h3 class="text-secondary mb-0" id="tituloCompras">Órdenes de Compra</h3>
            <button class="btn btn-fresa" id="btnNuevaCompra" onclick="abrirModalCompra()"><i class="bi bi-truck me-2"></i> Nueva Orden de Compra</button>
        </div>
        
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr><th>Nº OC</th><th>Proveedor</th><th>Producto</th><th>Cant. (kg/uds)</th><th>Precio Unit.</th><th>Total (C$)</th><th>Estado</th></tr>
                        </thead>
                        <tbody id="tbodyCompras">
                            <tr><td colspan="7" class="text-center text-muted py-4">Cargando datos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL COMPRA -->
    <div class="mi-modal-overlay" id="modalCompra">
        <div class="mi-modal-caja" style="max-width: 700px;">
            <div class="position-relative p-3" style="background-color: var(--mermelada-oscuro);">
                <h5 class="m-0 fw-bold text-center text-white w-100" style="color: white !important;"><i class="bi bi-truck me-2"></i> Nueva Orden de Compra</h5>
                <button type="button" class="btn-close btn-close-white position-absolute top-50 end-0 translate-middle-y me-3" onclick="cerrarModalCompra()"></button>
            </div>
            <form id="formCompra">
                <div class="p-4">
                    <div id="errorCompra" class="alert alert-danger d-none"></div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">Proveedor</label>
                            <input type="text" class="form-control" name="proveedor" id="proveedor" required placeholder="Ej: Frutas del Norte">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">Nº OC (Auto)</label>
                            <input type="text" class="form-control" name="numeroOC" id="numeroOC" readonly>
                        </div>
                    </div>

                    <h6 class="fw-bold border-bottom pb-2 mb-3 mt-4" style="color: var(--mermelada-rojo);">Detalle de Materia Prima</h6>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">Producto (Materia Prima)</label>
                            <select class="form-select" id="selectProductoCompra" required>
                                <option value="">Cargando...</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold small text-muted">Cantidad (kg/uds)</label>
                            <input type="number" class="form-control" id="cantidadCompra" step="0.01" min="0.01" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold small text-muted">Precio Unit. (C$)</label>
                            <input type="number" class="form-control" id="precioUnitario" step="0.01" min="0" required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-muted">Estado Inicial</label>
                            <select class="form-select" name="estado" id="estadoCompra">
                                <option value="Pendiente">Pendiente</option>
                                <option value="Recibida">Recibida</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-muted">Total a Pagar (C$)</label>
                            <input type="number" class="form-control bg-light" id="totalCompra" readonly>
                        </div>
                    </div>
                </div>
                <div class="p-3 bg-light d-flex justify-content-end gap-2 border-top">
                    <button type="button" class="btn btn-secondary" onclick="cerrarModalCompra()">Cancelar</button>
                    <button type="submit" class="btn btn-fresa" id="btnGuardarCompra">Generar Orden</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'login.html'; return; }
            
            const user = JSON.parse(localStorage.getItem('user'));
            const rol = user.rol.toLowerCase();
            renderizarUsuario();

            if (rol !== 'administrador' && rol !== 'produccion') {
                alert('No tienes permiso'); window.location.href = 'dashboard.html'; return;
            }
            document.getElementById('logoNavbar').href = rol === 'administrador' ? 'dashboard.html' : 'fabricacion.html';

            const modulosEscritorio = ['menu-ventas', 'menu-inventario', 'menu-fabricacion', 'menu-compras', 'menu-calidad'];
            const modulosMovil = ['menu-ventas-mobile', 'menu-inventario-mobile', 'menu-fabricacion-mobile', 'menu-compras-mobile', 'menu-calidad-mobile'];
            modulosEscritorio.forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
            modulosMovil.forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });

            if (rol === 'administrador') {
                modulosEscritorio.forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'block'; });
                modulosMovil.forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'block'; });
            } else if (rol === 'produccion') {
                ['menu-inventario', 'menu-fabricacion', 'menu-compras'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'block'; });
                ['menu-inventario-mobile', 'menu-fabricacion-mobile', 'menu-compras-mobile'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'block'; });
            }

            if (rol === 'administrador') {
                document.getElementById('btnNuevaCompra').style.display = 'none';
                document.getElementById('tituloCompras').innerText = "Reporte de Compras (Solo Lectura)";
            }
            
            await cargarCompras();
            await cargarSelectMateriaPrima();
        });

        async function cargarCompras() {
            const tbody = document.getElementById('tbodyCompras');
            try {
                const compras = await api.get('/compras');
                if (compras.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">No hay compras registradas</td></tr>`;
                    return;
                }
                tbody.innerHTML = compras.map(c => `
                    <tr>
                        <td><strong>${c.numeroOC}</strong></td>
                        <td>${c.proveedor}</td>
                        <td>${c.producto_codigo || '---'}</td>
                        <td>${c.cantidad || 0}</td>
                        <td>C$ ${c.precio_unitario ? parseFloat(c.precio_unitario).toFixed(2) : '0.00'}</td>
                        <td>C$ ${parseFloat(c.total).toFixed(2)}</td>
                        <td><span class="badge ${c.estado === 'Recibida' ? 'bg-success' : 'bg-warning text-dark'}">${c.estado}</span></td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Error: ${error.message}</td></tr>`;
            }
        }

        async function cargarSelectMateriaPrima() {
            try {
                const items = await api.get('/inventario');
                const select = document.getElementById('selectProductoCompra');
                select.innerHTML = '<option value="">Seleccione materia prima...</option>';
                // Solo mostrar Materias Primas (MP)
                items.filter(i => i.tipo === 'MP').forEach(i => {
                    select.appendChild(new Option(`${i.codigo} - ${i.producto}`, i.codigo));
                });
            } catch (error) { console.error(error); }
        }

        // CALCULAR TOTAL AUTOMÁTICAMENTE
        function calcularTotalCompra() {
            const cant = parseFloat(document.getElementById('cantidadCompra').value) || 0;
            const precio = parseFloat(document.getElementById('precioUnitario').value) || 0;
            document.getElementById('totalCompra').value = (cant * precio).toFixed(2);
        }
        document.getElementById('cantidadCompra').addEventListener('input', calcularTotalCompra);
        document.getElementById('precioUnitario').addEventListener('input', calcularTotalCompra);

        function abrirModalCompra() { 
            document.getElementById('formCompra').reset();
            document.getElementById('errorCompra').classList.add('d-none');
            document.getElementById('numeroOC').value = 'OC-' + Date.now().toString().slice(-6);
            document.getElementById('totalCompra').value = '0.00';
            document.getElementById('modalCompra').classList.add('activo'); 
        }
        function cerrarModalCompra() { document.getElementById('modalCompra').classList.remove('activo'); }
        document.getElementById('modalCompra').addEventListener('click', function(e) { if (e.target === this) cerrarModalCompra(); });

        document.getElementById('formCompra').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnGuardarCompra');
            const errorDiv = document.getElementById('errorCompra');
            btn.disabled = true; btn.innerText = 'Guardando...'; errorDiv.classList.add('d-none');

            const datos = {
                numeroOC: document.getElementById('numeroOC').value,
                proveedor: document.getElementById('proveedor').value,
                total: parseFloat(document.getElementById('totalCompra').value),
                estado: document.getElementById('estadoCompra').value,
                producto_codigo: document.getElementById('selectProductoCompra').value,
                cantidad: parseFloat(document.getElementById('cantidadCompra').value),
                precio_unitario: parseFloat(document.getElementById('precioUnitario').value)
            };

            try {
                await api.post('/compras', datos);
                cerrarModalCompra();
                await cargarCompras();
            } catch (error) {
                errorDiv.innerText = error.message; errorDiv.classList.remove('d-none');
            } finally {
                btn.disabled = false; btn.innerText = 'Generar Orden';
            }
        });
    </script>
</body>
</html>
