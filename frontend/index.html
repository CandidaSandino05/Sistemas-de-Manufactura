<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Frutitos de Casa ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">

    <div class="container-fluid vh-100">
        <div class="row h-100">
            
            <!-- LADO IZQUIERDO: Imagen y Marca (Oculto en celular) -->
            <div class="col-md-7 d-none d-md-flex bg-login-image align-items-center justify-content-center">
                <div class="text-white text-center p-5" style="z-index: 2; position: relative;">
                    <h1 class="display-4 fw-bold mb-3">Frutitos de Casa</h1>
                    <p class="lead fs-4">El sabor artesanal, ahora digitalizado.</p>
                    <p class="text-white-50 mt-4">Sistema de Planificación de Recursos Empresariales (ERP)</p>
                </div>
            </div>

            <!-- LADO DERECHO: Formulario de Login -->
            <div class="col-md-5 d-flex align-items-center justify-content-center bg-login-form">
                <div class="w-100" style="max-width: 400px; padding: 2rem;">
                    
                    <div class="text-center mb-5">
                        <span style="font-size: 3rem;">🍓</span>
                        <h2 class="fw-bold mt-2" style="color: var(--mermelada-rojo);">Bienvenido</h2>
                        <p class="text-muted">Ingresa tus credenciales para acceder al sistema</p>
                    </div>

                    <form action="modulos/dashboard.html">
                        <!-- Inputs con iconos -->
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control form-control-lg" id="usuario" placeholder="Usuario" required>
                            <label for="usuario">Usuario</label>
                        </div>
                        
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control form-control-lg" id="password" placeholder="Contraseña" required>
                            <label for="password">Contraseña</label>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="recordar">
                                <label class="form-check-label text-muted" for="recordar">Recordarme</label>
                            </div>
                            <a href="#" class="text-decoration-none" style="color: var(--mermelada-rojo);">¿Olvidaste tu contraseña?</a>
                        </div>

                        <button type="submit" class="btn btn-fresa w-100 btn-lg py-3" style="font-size: 1.1rem;">
                            Ingresar al Sistema
                        </button>
                    </form>

                    <div class="text-center mt-5 text-muted small">
                        &copy; 2026 Frutitos de Casa. Todos los derechos reservados.
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
